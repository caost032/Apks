name: Build ODPAR Territorial Domain APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize audited Android release source
        run: |
          set -euo pipefail
          python3 tools/prepare_android_release.py
          python3 tools/prepare_android_release.py --check

      - name: Validate ODPAR host contract
        run: |
          set -euo pipefail
          python3 tools/check_host_contract.py
          api="$(sed -n 's/^#define ODG_API_VERSION UINT32_C(\([0-9][0-9]*\)).*/\1/p' engine/include/odpar_game.h)"
          abi="$(sed -n 's/^#define ODG_FFI_ABI_VERSION UINT32_C(\([0-9][0-9]*\)).*/\1/p' engine/include/odpar_game.h)"
          save="$(sed -n 's/^#define ODG_SAVE_SCHEMA_VERSION UINT32_C(\([0-9][0-9]*\)).*/\1/p' engine/include/odpar_game.h)"
          test "$api" = "37"
          test "$abi" = "9"
          test "$save" = "25"
          echo "ODPAR_API_VERSION=$api" >> "$GITHUB_ENV"
          echo "ODPAR_ABI_VERSION=$abi" >> "$GITHUB_ENV"
          echo "ODPAR_SAVE_VERSION=$save" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Setup Android SDK pieces
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.22.1"

      - name: Resolve Flutter dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Analyze Dart and Flutter host
        working-directory: app/flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter host tests
        working-directory: app/flutter
        run: flutter test

      - name: Build and verify Android APK arm64
        working-directory: app/flutter
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libodpar_territorial_domain.so'
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libflutter.so'
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$apk"
          mkdir -p "$GITHUB_WORKSPACE/out"
          out="$GITHUB_WORKSPACE/out/ODPAR-Territorial-Domain-api${ODPAR_API_VERSION}-abi${ODPAR_ABI_VERSION}-save${ODPAR_SAVE_VERSION}-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Territorial-Domain-API37-ABI9-SAVE25-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
