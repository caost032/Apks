name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Flutter + C11 FFI APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read engine contract
        shell: bash
        run: |
          api="$(sed -n 's/^#define ODG_API_VERSION UINT32_C(\([0-9][0-9]*\)).*/\1/p' engine/include/odpar_game.h)"
          abi="$(sed -n 's/^#define ODG_FFI_ABI_VERSION UINT32_C(\([0-9][0-9]*\)).*/\1/p' engine/include/odpar_game.h)"
          save="$(sed -n 's/^#define ODG_SAVE_SCHEMA_VERSION UINT32_C(\([0-9][0-9]*\)).*/\1/p' engine/include/odpar_game.h)"
          test -n "$api" && test -n "$abi" && test -n "$save"
          echo "ODPAR_API_VERSION=$api" >> "$GITHUB_ENV"
          echo "ODPAR_FFI_ABI_VERSION=$abi" >> "$GITHUB_ENV"
          echo "ODPAR_SAVE_SCHEMA_VERSION=$save" >> "$GITHUB_ENV"
          echo "Building API $api / FFI ABI $abi / SAVE $save"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify host contract
        run: python3 tools/check_host_contract.py

      - name: Resolve Flutter dependencies
        working-directory: app/flutter
        run: flutter pub get

      - name: Analyze and test Dart
        working-directory: app/flutter
        run: |
          flutter analyze
          flutter test

      - name: Configure Android toolchain
        shell: bash
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$ANDROID_SDK_ROOT" "$FLUTTER_ROOT" \
            > app/flutter/android/local.properties
          gradle -p app/flutter/android wrapper \
            --gradle-version 8.10.2 --distribution-type bin
          chmod +x app/flutter/android/gradlew

      - name: Build release APK
        working-directory: app/flutter
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/ODPAR-Territorial-Domain-v15-api${ODPAR_API_VERSION}-abi${ODPAR_FFI_ABI_VERSION}-save${ODPAR_SAVE_SCHEMA_VERSION}.apk"

      - name: Verify native FFI libraries inside APK
        working-directory: app/flutter
        shell: python
        run: |
          import os
          from pathlib import Path
          from zipfile import ZipFile

          dist = Path("dist")
          apk = dist / (
              f"ODPAR-Territorial-Domain-v15-api{os.environ['ODPAR_API_VERSION']}"
              f"-abi{os.environ['ODPAR_FFI_ABI_VERSION']}"
              f"-save{os.environ['ODPAR_SAVE_SCHEMA_VERSION']}.apk"
          )
          required = {
              "lib/arm64-v8a/libodpar_territorial_domain.so",
              "lib/armeabi-v7a/libodpar_territorial_domain.so",
              "lib/x86_64/libodpar_territorial_domain.so",
          }
          with ZipFile(apk) as archive:
              entries = set(archive.namelist())
          missing = required - entries
          if missing:
              raise SystemExit(f"APK is missing native FFI libraries: {sorted(missing)}")
          print(f"APK verified: {apk}")

      - name: Write SHA-256
        working-directory: app/flutter
        run: sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-Territorial-Domain-APK-api${{ env.ODPAR_API_VERSION }}
          path: app/flutter/dist/
          if-no-files-found: error
          retention-days: 14

  wasm-contract:
    name: C11 WASM authority check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang lld

      - name: Build and smoke-test authoritative WASM
        run: |
          make wasm CLANG=clang
          node tools/wasm_smoke.mjs
