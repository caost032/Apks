name: WhiteLine Native APK

on:
  push:
    branches:
      - build/whiteline-native-2026-09-03
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: whiteline-native

    steps:
      - uses: actions/checkout@v4

      - name: Android SDK + NDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager no encontrado dentro de $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Usando sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Native tests
        shell: bash
        run: |
          chmod +x tools/test_native.sh
          chmod +x tools/build_android_apk_no_gradle.sh
          ./tools/test_native.sh

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          export ODPAR_ANDROID_PLATFORM=35
          export ODPAR_BUILD_TOOLS=35.0.0
          export ODPAR_ANDROID_MIN_API=26

          ./tools/build_android_apk_no_gradle.sh

      - name: Verify APK
        shell: bash
        run: |
          APK="dist/android/ODPAR-WhiteLine-Drift-0.7.0-native-arm64.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ODPAR-WhiteLine-Drift-APK
          path: whiteline-native/dist/android/ODPAR-WhiteLine-Drift-0.7.0-native-arm64.apk
          retention-days: 30
